<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="loading-modal"
     class="modal fade loading-modal"
     id="loadingModal"
     data-bs-backdrop="static"
     data-bs-keyboard="false"
     tabindex="-1"
     aria-labelledby="loadingModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <div class="spinner-border text-primary">
                    <span class="visually-hidden" th:text="#{modal.title}">Loading...</span>
                </div>
                <p class="mt-3 fs-5" th:text="#{modal.process.message}" >Searching for jobs...</p>
                <p class="mt-1 text-secondary" th:text="#{modal.wait.message}">This might take a moment.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
