<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="top-navbar" id="top-navbar-id"
     class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
    <a class="navbar-brand d-flex align-items-center me-2" th:href="@{/}">
        <i class="bi bi-code-slash fs-4 me-2"></i>
        <span th:text="#{app.title}"></span>
    </a>

    <div class="d-none d-md-block">
        <span class="text-secondary display-6" th:text="${currentDate}"></span>
    </div>

    <div class="dropdown text-center">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="languageDropdown"
                data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-translate"></i>
            <span th:text="${currentLocale}"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-sm-end app-dropdown-menu" aria-labelledby="languageDropdown">
            <li>
                <a class="dropdown-item" th:href="@{/(lang=en)}">
                    <span class="fi fi-gb me-1"></span>
                    <span th:text="English"></span>
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/(lang=uk)}">
                    <span class="fi fi-ua me-1"></span>
                    <span th:text="Українська"></span>
                </a>
            </li>
        </ul>
    </div>

    <div class="w-100 d-block d-md-none text-center">
        <span class="text-secondary display-6" th:text="${currentDate}"></span>
    </div>
</div>

</body>
</html>
