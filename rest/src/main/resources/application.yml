# Enable all Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  #  pattern:
  #    console: "%d{yyyy-MM-dd HH:mm:ss} | %-5level | %logger{1.} | %msg%n"
  level:
    web: ${LOG_LEVEL_WEB:info}
    root: ${LOG_LEVEL_ROOT:info}
    ua:
      findvacancies: ${LOG_LEVEL:info}