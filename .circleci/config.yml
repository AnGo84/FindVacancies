version: 2.1

executors:
  maven-executor:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project

jobs:
  build:
    executor: maven-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Build all modules
          command: mvn -B clean package -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

  test:
    executor: maven-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run tests
          command: mvn -B test

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build