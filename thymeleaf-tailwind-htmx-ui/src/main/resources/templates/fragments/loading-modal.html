<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="loadingModal"
     id="loadingModal"
     class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex justify-center items-center z-50 hidden">

    <div class="relative p-3 border w-80 shadow-lg rounded-md bg-white">
        <div class="text-center">
            <div class="mx-auto w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-blue-100">
                <svg class="h-5 w-5 text-blue-600 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none"
                     viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
            <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2" th:text="#{modal.title}">Loading...</h3>
            <div class="mt-1">
                <p class="text-sm text-gray-500" th:text="#{modal.process.message}">Searching for jobs...</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
